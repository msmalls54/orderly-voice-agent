  </defs>

  <rect width="1800" height="900" rx="34" fill="url(#bg)"/>
  <circle cx="1590" cy="100" r="230" fill="#F97316" opacity="0.05"/>
  <circle cx="160" cy="860" r="300" fill="#F97316" opacity="0.035"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(86 68)">
