      <path d="M15 12h5l3 8-4 3c3 6 6 9 12 12l3-4 8 3v5c0 3-3 6-7 5-15-3-27-15-30-30-1-4 2-7 5-7h5" transform="scale(.72) translate(11 9)" fill="none" stroke="#FFF7ED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="21" fill="#FFF7ED" font-size="18" font-weight="700" letter-spacing="2.2">AGENTPHONE LIVE CALL</text>
      <text x="68" y="47" fill="#AEB2C2" font-size="17">Exact sanitized transcript · September 4, 2026</text>
    </g>

    <g transform="translate(1450 76)">
