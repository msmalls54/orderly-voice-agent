      <text x="120" fill="#555A70" font-size="19">→</text>
      <text x="154" fill="#8C91A4" font-size="15" letter-spacing="1.1">ORDERLY</text>
      <text x="255" fill="#555A70" font-size="19">→</text>
      <text x="289" fill="#8C91A4" font-size="15" letter-spacing="1.1">DOORDASH CLI 0.2.4</text>
      <text x="1614" fill="#666B7E" font-size="14" text-anchor="end">Phone and full reference removed · caller turns 100% confidence</text>
