      <text x="100" y="22" fill="#FCA56A" font-size="17" font-weight="800" letter-spacing="1.7">CALLER</text>
      <text x="190" y="22" fill="#777C90" font-size="16">15:59:22 PT · verbal approval</text>
      <rect x="100" y="43" width="300" height="78" rx="23" fill="#F97316" filter="url(#shadow)"/>
      <text x="140" y="94" fill="#FFFFFF" font-size="31" font-weight="800">“Yes.”</text>
    </g>

    <g transform="translate(535 600)">
      <rect width="1165" height="121" rx="23" fill="#22352D" stroke="#4ADE80" stroke-opacity="0.42"/>
      <circle cx="42" cy="42" r="15" fill="#4ADE80" opacity="0.18"/>
      <path d="M34 42l6 6 12-14" fill="none" stroke="#4ADE80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
