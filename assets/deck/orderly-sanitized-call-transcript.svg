      <text x="190" y="22" fill="#777C90" font-size="16">15:58:55–15:58:59 PT · captured across two natural speech turns</text>
      <rect x="100" y="43" width="1514" height="130" rx="23" fill="#272A3A" stroke="#3B3F53" filter="url(#shadow)"/>
      <text x="140" y="94" fill="#F7F1E8" font-size="29" font-weight="650">
        <tspan x="140" dy="0">“Get me 12 donut”</tspan>
        <tspan x="140" dy="43">“holes and 2 apple fritters from My Happy Donut.”</tspan>
      </text>
    </g>

    <g transform="translate(86 370)">
