      <text x="100" y="22" fill="#F7E7CE" font-size="17" font-weight="800" letter-spacing="1.7">ORDERLY</text>
      <text x="215" y="22" fill="#777C90" font-size="16">15:59:10 PT · live DoorDash preview</text>
      <rect x="100" y="43" width="1514" height="154" rx="23" fill="#F6E8D5" filter="url(#shadow)"/>
      <text x="140" y="94" fill="#20212C" font-size="28" font-weight="650">
        <tspan x="140" dy="0">“I have the cart ready. The exact total is $19.01, including a $2.50 tip.”</tspan>
        <tspan x="140" dy="43">“Say yes to place it, or say cancel.”</tspan>
